name: Manage TestFlight tester

on:
  workflow_dispatch:
    inputs:
      mode:
        description: List groups or invite a tester
        required: true
        type: choice
        options: [list, invite]
        default: list
      email:
        description: Tester email (required for invite)
        required: false
        type: string
      beta_group:
        description: Exact beta group name (optional when only one exists)
        required: false
        type: string
      bundle_id:
        description: App bundle identifier
        required: true
        type: string
        default: com.bormisov.hanzideck

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
      TESTER_MODE: ${{ inputs.mode }}
      TESTER_EMAIL: ${{ inputs.email }}
      BETA_GROUP: ${{ inputs.beta_group }}
      APP_BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - name: List groups or invite tester
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          node <<'NODE'
          const crypto = require('node:crypto');

          const base64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = [
            base64url(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' })),
            base64url(JSON.stringify({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1199, aud: 'appstoreconnect-v1' })),
          ].join('.');
          const key = process.env.ASC_API_KEY_P8.replace(/\\n/g, '\n');
          const signature = crypto.sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${unsigned}.${signature}`;
          const origin = 'https://api.appstoreconnect.apple.com';

          async function api(path, options = {}) {
            const response = await fetch(`${origin}${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...options.headers },
            });
            const text = await response.text();
            const body = text ? JSON.parse(text) : undefined;
            if (!response.ok) throw new Error(`${options.method ?? 'GET'} ${path} failed (${response.status}): ${text}`);
            return body;
          }

          (async () => {
            const appQuery = new URLSearchParams({ 'filter[bundleId]': process.env.APP_BUNDLE_ID, limit: '2' });
            const apps = (await api(`/v1/apps?${appQuery}`)).data;
            if (apps.length !== 1) throw new Error(`Expected one app for ${process.env.APP_BUNDLE_ID}; found ${apps.length}.`);
            const app = apps[0];
            const reviewDetail = (await api(`/v1/apps/${app.id}/betaAppReviewDetail?fields%5BbetaAppReviewDetails%5D=contactFirstName,contactLastName,contactPhone,contactEmail,demoAccountRequired`)).data;
            const missingReviewFields = ['contactFirstName', 'contactLastName', 'contactPhone', 'contactEmail']
              .filter(field => !reviewDetail.attributes[field]?.trim());
            console.log(`Beta review contact: ${missingReviewFields.length ? `missing ${missingReviewFields.join(', ')}` : 'complete'}.`);
            const groupQuery = new URLSearchParams({ 'filter[app]': app.id, limit: '200' });
            const groups = (await api(`/v1/betaGroups?${groupQuery}`)).data;
            console.log(`Groups for ${process.env.APP_BUNDLE_ID}: ${groups.map(group => `${group.attributes.name} (${group.attributes.isInternalGroup ? 'internal' : 'external'})`).join(', ') || '(none)'}`);
            const buildQuery = new URLSearchParams({
              'filter[app]': app.id,
              'fields[builds]': 'version,uploadedDate,expirationDate,expired,processingState,buildAudienceType',
              sort: '-uploadedDate',
              limit: '10',
            });
            const builds = (await api(`/v1/builds?${buildQuery}`)).data;
            console.log(`Recent builds: ${builds.map(build => `${build.attributes.version} (${build.attributes.processingState}, ${build.attributes.buildAudienceType ?? 'STANDARD'})`).join(', ') || '(none)'}`);
            if (builds[0]) {
              const detail = (await api(`/v1/builds/${builds[0].id}/buildBetaDetail?fields%5BbuildBetaDetails%5D=internalBuildState,externalBuildState`)).data;
              console.log(`Latest beta state: internal=${detail.attributes.internalBuildState}, external=${detail.attributes.externalBuildState}.`);
            }
            if (process.env.TESTER_MODE === 'list') return;

            const email = process.env.TESTER_EMAIL.trim().toLowerCase();
            if (!email) throw new Error('Tester email is required in invite mode.');
            const requestedName = process.env.BETA_GROUP.trim();
            if (!groups.length) {
              const name = requestedName || 'External Testers';
              const created = await api('/v1/betaGroups', {
                method: 'POST',
                body: JSON.stringify({ data: {
                  type: 'betaGroups',
                  attributes: {
                    name,
                    isInternalGroup: false,
                    hasAccessToAllBuilds: true,
                    publicLinkEnabled: false,
                  },
                  relationships: { app: { data: { type: 'apps', id: app.id } } },
                } }),
              });
              groups.push(created.data);
              console.log(`Created private external group ${name}.`);
            }
            const selected = requestedName ? groups.filter(group => group.attributes.name === requestedName) : groups;
            if (selected.length !== 1) throw new Error(`Select exactly one beta group; matched ${selected.length}.`);
            const group = selected[0];

            if (!group.attributes.isInternalGroup) {
              const eligibleBuild = builds.find(build => build.attributes.processingState === 'VALID' &&
                !build.attributes.expired && build.attributes.buildAudienceType !== 'INTERNAL_ONLY');
              if (!eligibleBuild) throw new Error('No valid build is eligible for external TestFlight testing.');
              const groupBuilds = (await api(`/v1/betaGroups/${group.id}/relationships/builds?limit=200`)).data;
              if (!groupBuilds.some(build => build.id === eligibleBuild.id)) {
                await api(`/v1/betaGroups/${group.id}/relationships/builds`, {
                  method: 'POST',
                  body: JSON.stringify({ data: [{ type: 'builds', id: eligibleBuild.id }] }),
                });
                console.log(`Added build ${eligibleBuild.attributes.version} to ${group.attributes.name}.`);
              }
              const betaDetail = (await api(`/v1/builds/${eligibleBuild.id}/buildBetaDetail?fields%5BbuildBetaDetails%5D=externalBuildState`)).data;
              if (betaDetail.attributes.externalBuildState === 'READY_FOR_BETA_SUBMISSION') {
                if (missingReviewFields.length) {
                  if (!process.env.ASC_REVIEW_PHONE?.trim()) throw new Error('Missing ASC_REVIEW_PHONE secret.');
                  const attributes = {
                    contactFirstName: reviewDetail.attributes.contactFirstName?.trim() || 'Vlad',
                    contactLastName: reviewDetail.attributes.contactLastName?.trim() || 'Bormisov',
                    contactPhone: reviewDetail.attributes.contactPhone?.trim() || process.env.ASC_REVIEW_PHONE.trim(),
                    contactEmail: reviewDetail.attributes.contactEmail?.trim() || email,
                    demoAccountRequired: reviewDetail.attributes.demoAccountRequired ?? false,
                  };
                  await api(`/v1/betaAppReviewDetails/${reviewDetail.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ data: { type: 'betaAppReviewDetails', id: reviewDetail.id, attributes } }),
                  });
                  console.log('Completed missing beta review contact information.');
                }
                const localizations = (await api(`/v1/apps/${app.id}/betaAppLocalizations?limit=200&fields%5BbetaAppLocalizations%5D=description,feedbackEmail,locale`)).data;
                const description = 'Hanzi Deck helps learners practice Mandarin vocabulary, sentences, pinyin, handwriting, OCR, and spaced repetition.';
                if (!localizations.length) {
                  await api('/v1/betaAppLocalizations', {
                    method: 'POST',
                    body: JSON.stringify({ data: {
                      type: 'betaAppLocalizations',
                      attributes: { locale: 'en-US', description, feedbackEmail: email },
                      relationships: { app: { data: { type: 'apps', id: app.id } } },
                    } }),
                  });
                } else {
                  for (const localization of localizations) {
                    const attributes = {};
                    if (!localization.attributes.description?.trim()) attributes.description = description;
                    if (!localization.attributes.feedbackEmail?.trim()) attributes.feedbackEmail = email;
                    if (Object.keys(attributes).length) {
                      await api(`/v1/betaAppLocalizations/${localization.id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ data: { type: 'betaAppLocalizations', id: localization.id, attributes } }),
                      });
                    }
                  }
                }
                await api('/v1/betaAppReviewSubmissions', {
                  method: 'POST',
                  body: JSON.stringify({ data: {
                    type: 'betaAppReviewSubmissions',
                    relationships: { build: { data: { type: 'builds', id: eligibleBuild.id } } },
                  } }),
                });
                console.log(`Submitted build ${eligibleBuild.attributes.version} for TestFlight beta review.`);
              }
            }

            const testerQuery = new URLSearchParams({ 'filter[email]': email, limit: '200' });
            const matches = (await api(`/v1/betaTesters?${testerQuery}`)).data
              .filter(tester => tester.attributes.email.toLowerCase() === email);
            let tester;
            if (matches.length) {
              tester = matches[0];
              const currentGroups = (await api(`/v1/betaTesters/${tester.id}/relationships/betaGroups?limit=200`)).data;
              if (!currentGroups.some(membership => membership.id === group.id)) {
                await api(`/v1/betaGroups/${group.id}/relationships/betaTesters`, {
                  method: 'POST',
                  body: JSON.stringify({ data: [{ type: 'betaTesters', id: tester.id }] }),
                });
              }
            } else {
              const created = await api('/v1/betaTesters', {
                method: 'POST',
                body: JSON.stringify({ data: {
                  type: 'betaTesters',
                  attributes: { email },
                  relationships: { betaGroups: { data: [{ type: 'betaGroups', id: group.id }] } },
                } }),
              });
              tester = created.data;
            }

            const memberships = (await api(`/v1/betaTesters/${tester.id}/relationships/betaGroups?limit=200`)).data;
            if (!memberships.some(membership => membership.id === group.id)) throw new Error('Tester group assignment was not persisted.');
            console.log(`Tester ${email} assigned to external group ${group.attributes.name}; TestFlight invitation enabled.`);
          })().catch(error => { console.error(`::error::${error.message}`); process.exitCode = 1; });
          NODE
