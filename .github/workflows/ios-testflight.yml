name: Hanzi Deck iOS TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanzi-deck-ios-testflight
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Check Apple secrets before reserving a Mac runner
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          REVENUECAT_IOS_PUBLIC_SDK_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_SDK_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 REVENUECAT_IOS_PUBLIC_SDK_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret $name"
              missing=1
            fi
          done
          exit "$missing"

  ios:
    needs: credentials
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://zh.x.bormisov.com/api
      EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_SDK_KEY }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: premium
      APPLE_TEAM_ID: 6668YNMX76
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and check the app
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run audit:i18n
      - name: Set a unique App Store build number
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.ios.buildNumber = String(10000 + Number(process.env.GITHUB_RUN_NUMBER));
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios --repo-update
      - name: Apply Xcode 26 fmt workaround
        run: node scripts/patch-ios-fmt.mjs
      - name: Install Apple API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Archive without development signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/HanziDeck.xcworkspace \
            -scheme HanziDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HanziDeck.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HanziDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/HanziDeck-export" \
            -exportOptionsPlist ../.github/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  notify-telegram:
    name: Notify Telegram
    if: ${{ always() }}
    needs: [credentials, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram about build result
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.ios.result }}
          JOB_RESULTS: credentials=${{ needs.credentials.result }}, ios=${{ needs.ios.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          case "$BUILD_RESULT" in
            success) icon='✅'; summary='сборка и загрузка в TestFlight успешны' ;;
            cancelled) icon='⚠️'; summary='сборка отменена' ;;
            skipped) icon='❌'; summary='сборка не запущена из-за предыдущей ошибки' ;;
            *) icon='❌'; summary='сборка завершилась ошибкой' ;;
          esac
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message=$(printf '%s Hanzi Deck: %s\nWorkflow: %s\nВетка: %s\nCommit: %.7s\nJobs: %s\nЗапуск: %s' \
            "$icon" "$summary" "$GITHUB_WORKFLOW" "$BRANCH_NAME" "$GITHUB_SHA" "$JOB_RESULTS" "$run_url")
          curl --fail --silent --show-error --retry 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true'
