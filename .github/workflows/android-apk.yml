name: Hanzi Deck Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanzi-deck-android-apk
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://zh.x.bormisov.com/api
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_TEST_STORE_KEY }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: premium
      ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and check the app
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run audit:i18n
      - name: Set a unique Android version code
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.android.versionCode = 10000 + Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure separate internal APKs for each Android ABI
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '    defaultConfig {';
          const releaseMarker = '        release {';
          if (!source.includes(marker)) throw new Error(`Missing ${marker} in ${path}`);
          if (!source.includes(releaseMarker)) throw new Error(`Missing ${releaseMarker} in ${path}`);
          const splits = `    splits {
              abi {
                  reset()
                  enable true
                  universalApk false
                  include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
              }
          }

          `;
          const internalBuild = `        internal {
              // Standalone Telegram test build: bundle JS, but stay debuggable so RevenueCat Test Store is allowed.
              signingConfig signingConfigs.debug
              debuggable true
              matchingFallbacks = ['release']
              minifyEnabled false
              shrinkResources false
          }
          `;
          fs.writeFileSync(path, source
            .replace(marker, splits + marker)
            .replace(releaseMarker, internalBuild + releaseMarker));
          NODE
      - name: Build standalone internal APKs
        run: ./gradlew assembleInternal --no-daemon
        working-directory: frontend/android
      - name: Archive APKs separately
        id: archives
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          apk_dir="android/app/build/outputs/apk/internal"
          staging_dir="$RUNNER_TEMP/hanzi-deck-apks"
          archive_dir="$RUNNER_TEMP/hanzi-deck-archives"
          mkdir -p "$staging_dir" "$archive_dir"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            source_apk="$apk_dir/app-${abi}-internal.apk"
            apk_name="HanziDeck-${short_sha}-${abi}.apk"
            test -f "$source_apk"
            cp "$source_apk" "$staging_dir/$apk_name"
            (cd "$staging_dir" && zip -9 -j "$archive_dir/${apk_name%.apk}.zip" "$apk_name")
          done
          echo "dir=$archive_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$archive_dir"
      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-deck-android-${{ github.sha }}
          path: ${{ steps.archives.outputs.dir }}/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Send APK archives separately to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1003965333149'
          ARCHIVE_DIR: ${{ steps.archives.outputs.dir }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_message="$(git log -1 --format=%s "$GITHUB_SHA")"
          shopt -s nullglob
          archives=("$ARCHIVE_DIR"/*.zip)
          test "${#archives[@]}" -eq 4
          failed=0
          for archive in "${archives[@]}"; do
            archive_name="$(basename "$archive")"
            caption=$(printf 'Hanzi Deck Android APK archive\nFile: %s\nBranch: %s\nCommit: %.7s — %s\nBuild: %s' \
              "$archive_name" "$BRANCH_NAME" "$GITHUB_SHA" "$commit_message" "$run_url")
            if ! curl --fail --silent --show-error --retry 2 \
              --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${archive};type=application/zip" \
              --form-string "caption=${caption}" \
              >/dev/null; then
              echo "::error::Failed to send $archive_name to Telegram"
              failed=1
            fi
          done
          exit "$failed"

  notify-failure:
    name: Notify Telegram on failure
    if: ${{ always() && needs.android.result != 'success' }}
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - name: Send failure details
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1003965333149'
          BUILD_RESULT: ${{ needs.android.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_message="$(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || printf '%s' 'message unavailable')"
          message=$(printf '❌ Hanzi Deck Android APK: %s\nBranch: %s\nCommit: %.7s — %s\nBuild: %s' \
            "$BUILD_RESULT" "$BRANCH_NAME" "$GITHUB_SHA" "$commit_message" "$run_url")
          curl --fail --silent --show-error --retry 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true'
