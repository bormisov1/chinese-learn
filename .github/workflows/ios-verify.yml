name: Verify Hanzi Deck iOS native build

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://zh.x.bormisov.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:i18n
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios --repo-update
      - run: node scripts/patch-ios-fmt.mjs
      - name: Compile for iOS Simulator without signing
        run: |
          xcodebuild build \
            -workspace ios/HanziDeck.xcworkspace \
            -scheme HanziDeck \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  notify-telegram:
    name: Notify Telegram
    if: ${{ always() }}
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram about build result
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.ios.result }}
          JOB_RESULTS: ios=${{ needs.ios.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          case "$BUILD_RESULT" in
            success) icon='✅'; summary='проверочная iOS-сборка успешна' ;;
            cancelled) icon='⚠️'; summary='проверочная iOS-сборка отменена' ;;
            skipped) icon='❌'; summary='проверочная iOS-сборка пропущена' ;;
            *) icon='❌'; summary='проверочная iOS-сборка завершилась ошибкой' ;;
          esac
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message=$(printf '%s Hanzi Deck: %s\nWorkflow: %s\nВетка: %s\nCommit: %.7s\nJobs: %s\nЗапуск: %s' \
            "$icon" "$summary" "$GITHUB_WORKFLOW" "$BRANCH_NAME" "$GITHUB_SHA" "$JOB_RESULTS" "$run_url")
          curl --fail --silent --show-error --retry 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true'
