name: Verify Hanzi Deck iOS native build

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://zh.x.bormisov.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:i18n
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - run: node scripts/patch-ios-fmt.mjs
      - name: Compile for iOS Simulator without signing
        run: |
          xcodebuild build \
            -workspace ios/HanziDeck.xcworkspace \
            -scheme HanziDeck \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
